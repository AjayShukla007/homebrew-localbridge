name: Homebrew Tap Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test-bot:
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - macos-15-intel
          - ubuntu-latest
          - ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure tap is registered
        run: |
          if [ -z "${{ steps.set-up-homebrew.outputs.tap-name }}" ]; then
            brew tap AjayShukla007/localbridge "${{ github.workspace }}"
          fi

      - name: Style check
        run: brew style AjayShukla007/localbridge

      - name: Audit formula
        run: brew audit --strict --online AjayShukla007/localbridge/localbridge

      - name: Install formula
        run: brew install localbridge

      - name: Run Homebrew formula test
        run: brew test localbridge

      - name: Verify CLI binaries
        run: |
          localbridge version
          lb version

      - name: Uninstall formula
        if: always()
        run: brew uninstall localbridge || true
